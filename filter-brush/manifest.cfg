website="https://github.com/MatejZeman02/sara/tree/sara-base-modules"
tags=["brush",  "engine",  "filter"]

[dependencies]

; The stamp brush first, so the Brush an engine paints under is registered
; before its engines, and a fresh surface still opens on the stamp.
sara-stamp-brush="1.0.0-alpha.1"
