; What Sara's skeleton says of itself, read as every module's manifest is.
; The skeleton is the whole project, so its version is Sara's, the one
; project.godot gives as config/version, and a release moves the two together.
; Each release's notes are CHANGELOG.md at the repository's root.

[module]

id="sara-skeleton"
name="Sara Skeleton"
version="1.0.0-alpha.1"
sara_api=1
description="Sara's core: the canvas in VRAM, the compositor, the layers, the documents and the door every module registers through."
authors=["Matěj Zeman"]
license="GPL-3.0-or-later"
website="https://github.com/MatejZeman02/sara"
tags=["core"]
