; default, one of the four layouts Sara ships.
;
; The layout a fresh profile opens on, and therefore the row to pick to start
; over. docker_layout_default.cfg holds the same geometry, so the two answers to
; "what is default" are one answer. Both are written for 1920 by 1080 and
; fitted to the window they open on, closing the dockers
; `close_order` names on a host too small for them all, and the two carry the
; same order and the same Layers `floor_size`. Both open six
; dockers, the Minimap at the head of the right column, and keep the Reference
; closed in its place beside the Graph's, out of the left column (it was moved here when the left column
; was too narrow for it at 1280). The Tool Options docker heads the left column at 420, its rows
; scrolling where the brush's twelve ask for more. The Brush Presets stands
; open under it at 491, three rows of thumbnails at the small default size
; and its foot at 1008, inside a window 1048 tall. It was once closed here
; and is open again, a painter's "Brush presets
; window is hard to find", and it heads `close_order` so that a host with no
; room for both closes it first. A size is a want: the fit floors it up to
; what the docker needs and takes any shortfall off the Tool Options, as
; `docker_layout_default.cfg` says at more length. The Colour Picker is 393,
; the height its wheel at the column's width, the pair and the grip need, and
; the Layers under it takes the rest. The Minimap heads the right column at 180
; tall, where painters look for it, and heads `close_order` so a small host closes
; it first (docker_layout_default.cfg says more). The first row is 79, the row under the
; bar the fit keeps every docker below, so the fit moves nothing on a window
; 1048 tall.
;
; Shipped read-only under res://: nothing in the app can write here, which is
; the whole of how the note's "the defaults cannot be overwritten" is held.
; Editing the layout while one of these is current forks it to
; "<name> (custom)" in the painter's own layouts folder.
;
; Every built-in docker has a section, open or closed, and no two sections
; overlap at 1920 by 1080, so a docker the Window menu opens lands clear of the
; rest. A docker with no section was left wherever the last layout put it, which
; is how Brush Presets stood over the Minimap in Useful. The file sets no UI
; scale, so loading it keeps the painter's own. The element order names every
; row a fresh profile has, the menus in the bar's own order, because a row the
; order lacks is put after everything else.

[_layout_meta_]

close_order=["MinimapDocker", "BrushPresetsDocker", "ToolOptionsDocker", "LayersDocker", "ColorDocker"]
