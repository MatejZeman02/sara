; minimalistic, one of the four layouts Sara ships.
;
; Only the three dockers a stroke needs, with the top bar down to what a brush
; uses. The toolbox keeps every tool: hiding one is how a painter loses a tool
; they cannot find again, and the note asks for a smaller layout rather than a
; smaller program. The Colour Picker is default's, the height its shape and
; pair need with the swatch rows off, and the Layers docker ends at 1004, so the
; column is no taller than a 1280 by 1024 panel. The closed dockers keep
; default's places but the Stats, which stands under the Minimap since the Info
; here is still 520 tall.
;
; Fitted to the window the way default is: on a host too short
; for the Colour Picker over the Layers docker, the Layers closes first.
;
; Shipped read-only under res://: nothing in the app can write here, which is
; the whole of how the note's "the defaults cannot be overwritten" is held.
; Editing the layout while one of these is current forks it to
; "<name> (custom)" in the painter's own layouts folder.
;
; Every built-in docker has a section, open or closed, and no two sections
; overlap at 1920 by 1080, so a docker the Window menu opens lands clear of the
; rest. A docker with no section was left wherever the last layout put it, which
; is how Brush Presets stood over the Minimap in Useful. The file sets no UI
; scale, so loading it keeps the painter's own. The element order names every
; row a fresh profile has, the menus in the bar's own order, because a row the
; order lacks is put after everything else.

[_layout_meta_]

close_order=["LayersDocker", "ColorDocker"]
os_scale=1.0
preset="minimalistic"
written_for=Vector2i(1920, 1080)

