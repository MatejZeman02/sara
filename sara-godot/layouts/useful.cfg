; useful, one of the four layouts Sara ships.
;
; Everything worth having open while painting, which is default plus the
; graph. The Minimap heads the right column as in default, 180 tall above the
; Colour Picker and the Layers, where painters look for it, and the Graph stands
; open in the middle at (1210, 79), clear of the canvas's centre. The Info
; panel, the recorder, the recent presets, the undo history and the pop-up
; palette are the ones a painter opens for a reason rather than lives in, and
; the picker's two numeric slider rows are the shape a painter reaches for when
; the wheel is not precise enough. Info is closed because open it read as a
; developer's page and took a quarter of the room beside the canvas. It keeps
; its place above the Stats, so the Window menu opens it there.
;
; Fitted to the window the way default is. On a host too
; small for it the close order takes the Minimap and the Graph first, which
; leaves default's five, then the Reference and what default closes, so a 1280
; by 1024 panel opens it without them. The closed ones take the right of the
; middle, the Stats at the foot of the left of it.
;
; Shipped read-only under res://: nothing in the app can write here, which is
; the whole of how the note's "the defaults cannot be overwritten" is held.
; Editing the layout while one of these is current forks it to
; "<name> (custom)" in the painter's own layouts folder.
;
; Every built-in docker has a section, open or closed, and no two sections
; overlap at 1920 by 1080, so a docker the Window menu opens lands clear of the
; rest. A docker with no section was left wherever the last layout put it, which
; is how Brush Presets stood over the Minimap in Useful. The file sets no UI
; scale, so loading it keeps the painter's own. The element order names every
; row a fresh profile has, the menus in the bar's own order, because a row the
; order lacks is put after everything else.

