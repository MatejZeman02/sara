; photoshop, a layout shaped like Photoshop's Essentials workspace.
;
; Pressed in by the Photoshop button of "I'm coming from", on Quick settings and
; on Preferences > Interface, beside the Photoshop shortcut profile and
; Photoshop Dark. Essentials keeps the tools on the left and one column of
; panels on the right: Color on top, Properties under it and Layers at the foot.
; Sara's Tool Options docker stands where Properties does, since it holds what
; the tool in hand takes. Sara's four layouts all keep the Tool Options in a
; left column, so none of them came close. The Colour Picker keeps the 393 its
; wheel needs, the Tool Options takes 290 and scrolls its rows, and the Layers
; takes the rest down to 1065. The Layers carries no floor_size: with the
; default's 272 the column's floors were taller than a 1920 by 1080 screen at a
; UI scale of 1.25, and the fit closed the Tool Options and the Layers there.
;
; Photoshop has no docker of brush tiles open by default, so the Brush Presets
; is closed, in the left column where Sara keeps it. Everything else is closed
; in the places the default puts it, and the element state is the default's.
; The file sets no UI scale, so loading it keeps the painter's own. Shipped
; read-only under res://, and an edit forks it to "photoshop (custom)" in the
; painter's own layouts folder.

