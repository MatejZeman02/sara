; krita, a layout shaped like Krita's default workspace.
;
; Pressed in by the Krita button of "I'm coming from", on Quick settings and on
; Preferences > Interface, beside the Krita shortcut profile and Krita Grey. Krita
; keeps its toolbox on the left and every other docker in one column on the
; right: the Advanced Colour Selector on top, the Brush Presets and the Layers
; under it. Sara's four layouts all stand the Tool Options and the Brush Presets
; in a left column, so none of them came close, and this file moves them. The
; Colour Picker keeps the 393 its wheel needs, the Brush Presets takes the 300
; of two rows of tiles and a little, and the Layers takes the rest down to 1065,
; over the 272 floor the default gives it.
;
; The Tool Options is open, because Krita's own default workspace opens one,
; and it stands in the left column where Sara keeps it, beside
; the toolbox, so the right column keeps the Brush Presets' 300 and the Layers
; over their 272 floor. Krita shows the brush's size and opacity on its top bar
; as well, which is where Sara's own bar shows them.
; Everything else is closed in the places the default puts it, and the element
; state is the default's. The file sets no UI scale, so loading it keeps the
; painter's own. Shipped read-only under res://, and an edit forks it to
; "krita (custom)" in the painter's own layouts folder.

