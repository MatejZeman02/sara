; full, one of the four layouts Sara ships.
;
; Every element of every docker on, and every docker open but the Info and the
; Pop-up Palette, which are the two a painter opens for a reason and which stood
; over the painting on a first look. The Window menu opens them where they sit
; here, and this is still the row to pick when something is missing and the
; question is where it went.
; The Filters docker ships closed, since Filter > Browse Filters... summons
; it and its 160 wide strip by the right column would join that column and
; narrow every host the fit closes the middle on. The Sphere
; ships closed for the same reason, since its strip would join the middle column
; the fit closes first, and the Window menu opens it there.
; The Exposure docker ships closed too, since no free place on the screen is
; wide enough for it at its floor and every docker above is open, so
; the Window menu opens it where the painter drags it.
; Default's geometry with every docker open, which is why default places the
; seven it keeps closed so that none of them overlaps another.
;
; Fitted to the window the way default is. Its middle is two
; columns side by side, the Recorder, the Graph and the Recent Presets, and the
; Minimap over the Stats over the Undo History, and the painting keeps the 60 it
; has here rather than two fifths. The Stats stands under the Minimap rather
; than in default's place, and closes after the Graph. On a
; narrower host the close order takes the rest of the middle but the Minimap,
; and then what Useful closes.
;
; Shipped read-only under res://: nothing in the app can write here, which is
; the whole of how the note's "the defaults cannot be overwritten" is held.
; Editing the layout while one of these is current forks it to
; "<name> (custom)" in the painter's own layouts folder.
;
; Every built-in docker has a section, open or closed, and no two sections
; overlap at 1920 by 1080, so a docker the Window menu opens lands clear of the
; rest. A docker with no section was left wherever the last layout put it, which
; is how Brush Presets stood over the Minimap in Useful. The file sets no UI
; scale, so loading it keeps the painter's own. The element order names every
; row a fresh profile has, the menus in the bar's own order, because a row the
; order lacks is put after everything else.

