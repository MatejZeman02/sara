; clip_studio, a layout shaped like Clip Studio Paint's default workspace.
;
; Pressed in by the Clip Studio Paint button of "I'm coming from", on Quick
; settings and on Preferences > Interface, beside the Clip Studio Paint shortcut
; profile and Clip Studio Dark. Clip Studio Paint keeps its Tool palette at the
; far left and a column beside it of the Sub Tool palette, the Tool Property
; palette and the Color Wheel, and on the right the Navigator above the Layer
; palette. Sara's dockers stand where those palettes do: the Brush Presets where
; the Sub Tool palette lists the brushes, the Tool Options where the Tool
; Property does, the Colour Picker at the foot of the left column, the Minimap
; where the Navigator is and the Layers under it. The Brush Presets takes the
; 385 the docker opens at on the running app, its tag row and two rows of
; tiles, the Tool Options takes 290 and scrolls its rows, the Colour Picker the
; rest of the column down to 1065, more than the 253 its wheel alone asks, and
; the Layers takes the right column under the Minimap's 230.
;
; Everything else is closed in the places the default puts it, and the element
; state is the default's. The file sets no UI scale, so loading it keeps the
; painter's own. Shipped read-only under res://, and an edit forks it to
; "clip_studio (custom)" in the painter's own layouts folder.

[_layout_meta_]

close_order=["MinimapDocker", "BrushPresetsDocker", "ToolOptionsDocker", "LayersDocker", "ColorDocker"]
os_scale=1.0
preset="clip_studio"
