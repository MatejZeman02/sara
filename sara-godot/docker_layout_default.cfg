; What a profile with no layout file of its own opens on. The same geometry as
; layouts/default.cfg, so picking Dockers > Layouts > default is the same
; as starting over rather than nearly the same.
;
; Written for a 1920 by 1080 window, which `written_for` says, and fitted to the
; window it opens on for as long as it is still the default nobody has edited
; (`ui/layout/fit/docker_layout_fit.gd`). The dockers it opens lead
; the Window menu, in the order this file lists them.
;
; On a host too small for all of them the fit closes the dockers `close_order`
; names, first to last, until each column's floors fit its height and the
; columns leave two fifths of the width to paint in, and opens them again once
; there is room. A closed docker keeps its Window menu row.
; The Layers docker's `floor_size` is the width its blend row reads whole at
; and the height that shows four layers. layouts/default.cfg carries the same.
;
; The Reference ships closed, since a first screen should not show a tool for a
; job the painter has not chosen. Its section stands clear of both columns, beside the
; Graph's, where its chord or the Window menu opens it
; without covering a docker this file opens, and the order does not name it,
; since the fit places only what this file opens. Where a
; host is narrow enough for its place to lay it over a docker this file opens,
; as the right column does at 1.25 on a 1080 screen, it opens beside that
; docker's column instead.
;
; The Tool Options docker is 420 tall and heads the left column, its rows
; scrolling where the brush's twelve ask for more. The Brush Presets stands
; under it with a gap of 18 and the 491 three rows of presets at the small
; default thumbnail size need, so its foot ends at 1008, inside the 1009 a
; window 1048 tall keeps above its status line. It ships open because on a
; tablet nothing else on screen says where the presets are. It heads
; `close_order` for that: a host with no room for both closes it first and
; every smaller host is fitted as if it shipped closed. Where a host is too
; short for its place, as 1280 by 800 is, the chord or the Window menu opens
; it beside the column by the Reference's rule.
;
; A size here is a want, which the fit floors up to what the docker needs and
; shares down when the column is short of both. The Tool Options is the one
; of the two that can give, since its rows scroll.
;
; The Minimap heads the right column at 180 tall, where painters look for it,
; and the Colour Picker and the Layers stand under it with the 10 the left column
; keeps between its dockers, so the three fill the column from the bar to the
; foot the Layers always had. It heads `close_order`, so a host short of room
; closes it before anything else, and the fit then starts the column at the
; Minimap's top, which leaves no hole above the Colour Picker.
;
; The Colour Picker is 393 tall, which is what its wheel at the column's width,
; the pair under it, the drag bar, the margins and the grip need, with no band
; left empty under the pair, and the Layers docker under it takes the 393
; left, the column's 986 less the Minimap, the Colour Picker and the two gaps.
;
; The first row is 79, the row `MainDockers.below_bar` keeps every docker
; under: the bar is 64 with its second row on, as a fresh profile has it, and
; the row is 15 below that. A value of 78, the row under the bar before its
; second row went on, would have the fit move every column a pixel lower on
; every boot, so a state dump would never read what the file said. The
; Filters docker is 504 tall, so its foot is the 1048 window's and the fit
; does not lift it over the Reference's foot there.

