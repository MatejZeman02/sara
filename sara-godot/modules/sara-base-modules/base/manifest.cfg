; What this module says of itself, read by Sara before any of its code runs.
; The version moves with each release, see CHANGELOG.md at the repository's root.

[module]

id="sara-base-modules"
name="Sara Base Tools"
version="1.0.0-alpha.1"
sara_api=1
description="Sara's tools: the selections, the fill, the eyedropper, the transform, the move, the navigation and the rest of the toolbox."
authors=["Matěj Zeman"]
license="GPL-3.0-or-later"
website="https://github.com/MatejZeman02/sara/tree/sara-base-modules"
tags=["tools"]

[dependencies]

; The stamp brush, registered before this module.
;
; Two reasons, and the first is a real dependency: `BrushSettingsScript` is
; that module's file and the fill's settings resource is an instance of it.
; The second is what a painter sees. `ToolMachine` starts a fresh surface on
; the first painting tool the registry lists, and the loader walks the folders
; in name order, so without this line `base` loads before `stamp-brush` and
; Sara opens on the bucket fill. Declaring the dependency puts the brush
; first, and says why in the one place a reader of either module will look.
sara-stamp-brush="1.0.0-alpha.1"
