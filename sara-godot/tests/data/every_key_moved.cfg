[meta]

version=27

[ui]

scale=1.25
font_scale=1.2
language="cs"
embed_subwindows=false
main_window={
"maximized": false,
"rect": Rect2i(40, 30, 1100, 700),
"screen": 1
}
secondary_workspace_screen=1
secondary_workspace_rect=Rect2i(10, 20, 800, 600)
advanced_options=true
experimental_tools=true
second_row=false
docker_hide_button=false
show_grid=true
grid_size=32
reset_zoom="pixels"
reset_zoom_size=110
search_window_size=Vector2i(720, 480)
search_recents=["command:filter_gaussian_blur", "row:Tool:Brush"]
integer_zoom=true
color_picker_shape="square"
keep_blend_mode=true
import_fit="inside"
import_depth="f32"
filter_way="layer"
filter_affect_all=true
blend_favorites=["screen", "overlay"]
tonemap_highlights=false
tonemap_knee=0.7
tonemap_desaturation=0.3
gamut_mapping="clip"
show_relief=false
relief_light_angle=135.0
relief_strength=2.5
relief_gloss=0.03
display_exposure_on=true
display_exposure_stops=1.5
display_profile="display_p3"
display_profile_file="/home/painter/.local/share/icc/panel.icc"
display_fill="native"
proof_profile="rec2020"
proof_profile_file="/home/painter/.local/share/icc/client_phone.icc"
display_custom_space={
"primaries": [[0.68, 0.32], [0.265, 0.69], [0.15, 0.06]],
"white": [0.3127, 0.329]
}
proof_custom_space={
"primaries": [[0.708, 0.292], [0.17, 0.797], [0.131, 0.046]],
"white": [0.32168, 0.33767]
}
canvas_proof_mode="p25_a_module_not_loaded"
minimap_proof_mode="p25_another_module_not_loaded"
shape_check_method="notan"
shape_check_levels=false
shape_check_level_count=3
shape_check_reach=0.03
shape_check_across=48
shape_check_notan_values=3
shape_check_notan_threshold=0.4
shape_check_notan_dark=0.25
shape_check_notan_light=0.75
software_cursor="always"
window_button_position="left"
window_button_style="traffic"
welcome_at_start=false
show_last_session=false
last_version_seen="0.12.0"
last_tip_shown="tab_hides_the_dockers"
first_launch_done=true
screen_mode="maximised"

[input]

tablet_max_pressure=0.75
cursor_prediction_ms=12.0
cursor_lead="off"
tablet_driver="winink"
pen_buttons={
"extra1": "eyedropper",
"extra2": "eraser",
"middle": "context_menu",
"right": "pan"
}
mouse_middle="eyedropper"
midi_listen=true
midi_bindings={
"Probe Mixer": {
"control/0/7": {
"kind": "dial",
"label": "Size (brush)",
"target": "tool/brush/radius"
}
}
}

[theme]

name="violet-cyan"
font="noto-sans"

[shortcuts]

profile="krita"

[files]

versions=3
recent=["/tmp/p25-one.sad", "/tmp/p25-two.sad"]
autosave_minutes=5.0
autosave_working_file=true
export_author="Painter"
location_country="NZ"
location_zone="Pacific/Chatham"
location_place="Brno"
location_in_exports=true
last_template="a4"
new_document_details=true
saved_color_spaces=[{
"name": "Wide print",
"space": {
"transfer": "gamma"
}
}]
keep_reference_pictures=true
history_depth=20
visibility_in_history=false
ask_when_opening=false
ask_eight_bit_when_opening=true
ask_panorama=false

[recorder]

directory="/tmp/p25-timelapse"
settle_seconds=3.0
cap_bytes=123456789
note_box_size=Vector2i(400, 300)

[tools]

selection_feather=0.05
preset_icon_size=64
preset_thumb_tip=false
preset_favorites=["Ink", "Pencil"]
preset_bundles_off=["Sara Filters"]
preset_tag_filter={
"Filter": "hide",
"Sketch": "show"
}
brush_editor_page="tip"
brush_editor_presets_open=true
brush_editor_pad_width=300
brush_editor_pad_shut=true
brush_editor_presets_width=280
brush_slots=["Ink", "", "Pencil", "", "", "", "", "", "", "Wash"]

[performance]

painting_frame_rate="30"
half_size_view_while_moving=true
thumbnails_while_painting="pen_lift"
light_mode_offer="not_now"
filter_preview_on_canvas=false
idle_after_seconds=12.0
card_memory_share=0.35

[modules]

off=["box_blur", "gamut_mask"]
