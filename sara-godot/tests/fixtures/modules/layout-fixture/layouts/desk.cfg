; desk, the one layout the layout fixture module ships.
;
; The claim it exists to prove is that a module's `layouts/` folder is listed
; under the module's name, loads, and forks like a shipped one. So it is a real
; layout with real geometry rather than an empty file: three dockers in places no
; other layout puts them, which is what makes "it loaded" readable in a dump.
;
; SPDX-License-Identifier: GPL-3.0-or-later

[_layout_meta_]

os_scale=1.0
preset="layout-fixture/desk"

[ToolBoxDocker]

position=Vector2i(4, 96)
size=Vector2i(60, 400)
visible=true

[LayersDocker]

position=Vector2i(1500, 96)
size=Vector2i(320, 420)
visible=true

[ColorDocker]

position=Vector2i(1500, 540)
size=Vector2i(320, 380)
visible=true

[ToolOptionsDocker]

position=Vector2i(70, 330)
size=Vector2i(300, 430)
visible=false
